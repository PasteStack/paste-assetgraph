include:
  - project: 'tomshley/brands/global/tware/tech/products/provisioning/cicd-pipelines'
    ref: 'v0.13.0'
    file: '/adapters/gitlab/ci/adapter.yml'

variables:
  CICD_PIPELINES_RUNNER_TAG: "0.13.0"
  BASE_CONTAINERS_REGISTRY: registry.gitlab.com/tomshley/brands/global/tware/tech/products/provisioning/base-containers
  BASE_CONTAINERS_UPSTREAM_TAG: "0.6.1"
  # Build, test, and publish run on the toolchain baked into
  # CICD_PIPELINES_RUST_IMAGE; the msrv-rust job proves Cargo.toml's
  # rust-version floor (1.83) separately, and the oxc pin tracks that floor.
  TOMSHLEY_CICD_CARGO_BINARY: paste-assetgraph
  TOMSHLEY_CICD_CARGO_TARGETS: "x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-gnu"
  TOMSHLEY_CICD_CARGO_NATIVE_ROOT: runtime/scala/sbt-plugin/src/main/resources/native
  DETERMINISM_CONFIG: features/determinism.conf
  DETERMINISM_REFERENCE: .determinism/linux
  PASTE_ASSETGRAPH_TEST_FIXTURE: "${CI_PROJECT_DIR}/target/shared-fixture"

# Branch and tag pipelines carry the build; merge request pipelines would only
# duplicate them (the adapter's workflow admits both), and a five-target
# cross-compile is not worth running twice. Tag pipelines must keep these jobs:
# the publish and release jobs declare `needs` on them.
.runs-on-branch-or-tag:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

# Formatting is checked before anything is built: it needs only the sources, and a
# drifting format is cheapest to catch first. rustfmt.toml pins the style edition so
# every toolchain produces the same bytes.
lint-rust:
  extends: [.runs-on-branch-or-tag]
  image: ${CICD_PIPELINES_RUST_IMAGE}
  stage: .pre
  script:
    - cargo fmt --all --check
    # The warning-denied lints the implementation contract makes mandatory —
    # a clean compile alone is not the gate.
    - cargo clippy --workspace --all-targets --locked -- -D warnings
    # The release flow bumps VERSION, Cargo.toml and runtime/node/package.json
    # together; this line and the runtime/node version test catch a missed one.
    - test "$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)" = "$(tr -d '[:space:]' < VERSION)"
    # The shipped binaries statically link every crate in Cargo.lock's
    # normal dependency closure; their license texts must match it.
    - python3 scripts/third_party_licenses.py --check

# The declared minimum toolchain gets its own gate: the pinned image's
# compiler is newer, so only a 1.83 job can prove rust-version = "1.83" is
# honest — fmt and the warning-denied lints run under it exactly as the
# release contract states, and the workspace tests run under it too. The
# vendored entry image carries an immutable 1.83.0 toolchain with rustfmt
# and clippy baked in; the upstream `rust:1.83` image is a minimal install
# without them, so `cargo fmt` would fail before the gate even compiles.
# The pinned 0.6.1 image vendors the C toolchain a musl Rust needs to
# link build scripts, proc macros, and tests. It does not yet vendor
# the Windows std component, so the job fetches it pinned by content —
# same posture as the macOS SDK below. The last gate type-checks the
# windows-gnu target at the same floor: the cfg(not(unix)) code paths
# never compile on this host, so only a target check can see them.
msrv-rust:
  extends: [.runs-on-branch-or-tag]
  image: ${BASE_CONTAINERS_REGISTRY}/entry-rust-1_83-vendored:${BASE_CONTAINERS_UPSTREAM_TAG}
  stage: .pre
  variables:
    WIN_STD_SHA256: "854529418d3b7db1a60d7d49b07c648e6a660783275635f7f931247229877002"
  script:
    - apk add --no-cache curl xz
    - cargo fmt --all --check
    - cargo clippy --workspace --all-targets --locked -- -D warnings
    - cargo test --locked --workspace
    - |
      component="rust-std-1.83.0-x86_64-pc-windows-gnu"
      curl --fail --silent --show-error --location \
        --output "/tmp/${component}.tar.xz" \
        "https://static.rust-lang.org/dist/${component}.tar.xz"
      echo "${WIN_STD_SHA256}  /tmp/${component}.tar.xz" | sha256sum -c -
      mkdir -p /tmp/win-std && tar xJf "/tmp/${component}.tar.xz" -C /tmp/win-std
      cp -r "/tmp/win-std/${component}/rust-std-x86_64-pc-windows-gnu/lib/rustlib/x86_64-pc-windows-gnu" \
        "$(rustc --print sysroot)/lib/rustlib/"
    - cargo check --workspace --all-targets --locked --target x86_64-pc-windows-gnu

build-rust:
  extends: [.runs-on-branch-or-tag, .tomshley-cicd-cargo-zigbuild]
  variables:
    # The Darwin targets link system frameworks (chrono -> iana-time-zone ->
    # core-foundation-sys links CoreFoundation), which needs a macOS SDK. The
    # runner image ships no SDK, so the job supplies one and points SDKROOT at
    # it: cargo-zigbuild reads SDKROOT and passes the sysroot, include, library,
    # and framework paths to the linker for apple-darwin targets only. Nothing
    # is added to RUSTFLAGS, so the Linux and Windows targets are unaffected.
    MACOS_SDK_VERSION: "14.5"
    # The extracted SDK is rebuilt from the verified archive on every
    # run and is deliberately not cached — a cached directory could be
    # substituted where the pinned archive cannot.
    SDKROOT: "${CI_PROJECT_DIR}/.macos-sdk-current/MacOSX${MACOS_SDK_VERSION}.sdk"
    # Shared-library targets for the language runtimes — separate from the
    # musl CLI targets above.
    PASTE_LIB_TARGETS: "x86_64-unknown-linux-gnu.2.17 aarch64-unknown-linux-gnu.2.17 x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-gnu"
    PASTE_LIB_ROOT: runtime/native/native-lib
    # The SDK enters the linker path for the published Darwin binaries, so the
    # download is pinned by content, not only by tag: a release asset can be
    # replaced, a tag can be moved, and neither would be visible in a build log.
    MACOS_SDK_SHA256: "6e146275d19f027faa2e8354da5e0267513abf013b8f16ad65a231653a2b1c5d"
  cache:
    # The cache holds only the verified archive — keyed apart from the
    # earlier layout that cached an extracted SDK, so that copy is never
    # restored and re-uploaded again.
    key: macos-sdk-archive-${MACOS_SDK_VERSION}
    paths:
      - .macos-sdk/
  before_script:
    - |
      mkdir -p .macos-sdk .macos-sdk-current
      archive=".macos-sdk/MacOSX${MACOS_SDK_VERSION}.sdk.tar.xz"
      if [ -f "${archive}" ]; then
        echo "Using cached macOS SDK archive ${MACOS_SDK_VERSION}"
      else
        echo "Downloading macOS SDK ${MACOS_SDK_VERSION}"
        curl --fail --silent --show-error --location \
          --output "${archive}" \
          "https://github.com/joseluisq/macosx-sdks/releases/download/${MACOS_SDK_VERSION}/MacOSX${MACOS_SDK_VERSION}.sdk.tar.xz"
      fi
      echo "${MACOS_SDK_SHA256}  ${archive}" | sha256sum -c -
      rm -rf "${SDKROOT}"
      tar -xf "${archive}" -C .macos-sdk-current/
      test -d "${SDKROOT}" || { echo "macOS SDK missing at ${SDKROOT}" >&2; exit 1; }
  script:
    - !reference [.tomshley-cicd-cargo-zigbuild, script]
    - |
      # The release recipe uploads each target/<triple>/release/<binary> as
      # <binary>-<platform>[.exe], so SHA256SUMS must name exactly that
      # upload set — a checksum entry without a published asset would make
      # `sha256sum -c` fail on a directory of downloaded release files, and
      # an uploaded file missing a checksum would go unverified. The build
      # recipe's checksums carry native-resource paths no download uses, so
      # they are regenerated here under the release names; the staging dir
      # mirrors the upload names 1:1 and is checked against the targets the
      # publisher reads, not trusted on its own say-so.
      rm -rf .release-assets
      mkdir -p .release-assets
      . "${TOMSHLEY_CICD_TOOLBOX_ROOT}/lib/rust-targets.sh"
      for target in ${TOMSHLEY_CICD_CARGO_TARGETS}; do
        platform="$(rust_target_platform "${target}")" || \
          { echo "no release platform mapping for ${target}" >&2; exit 1; }
        binary="$(rust_target_binary "${target}" "${TOMSHLEY_CICD_CARGO_BINARY}")"
        file="target/${target}/release/${binary}"
        [ -f "${file}" ] || { echo "release binary not found: ${file}" >&2; exit 1; }
        cp "${file}" ".release-assets/${TOMSHLEY_CICD_CARGO_BINARY}-${platform}${binary#"${TOMSHLEY_CICD_CARGO_BINARY}"}"
      done
      # The legal files ride the release beside the binaries — uploaded
      # under their basenames by the release recipe's extra-assets input
      # (declared on the release-assets job below) and covered by the
      # same SHA256SUMS a downloader verifies the binaries with.
      cp LICENSE NOTICE THIRD_PARTY_LICENSES.md .release-assets/
      (cd .release-assets && sha256sum -- "${TOMSHLEY_CICD_CARGO_BINARY}"-* LICENSE NOTICE THIRD_PARTY_LICENSES.md) > SHA256SUMS
      # Candidate↔checksum parity: every uploaded file has exactly one entry
      # and every entry names an uploaded file.
      staged="$(cd .release-assets && ls | sort)"
      summed="$(awk '{print $2}' SHA256SUMS | sort)"
      [ "${staged}" = "${summed}" ] || { echo "SHA256SUMS does not cover the release candidate set 1:1" >&2; exit 1; }
      (cd .release-assets && sha256sum -c "../SHA256SUMS" >/dev/null) || \
        { echo "SHA256SUMS fails verification against the candidates" >&2; exit 1; }
      cat SHA256SUMS
    - |
      # The runtimes load the asset graph in-process from this shared library.
      # Shared objects must match the host's libc. Build both glibc and musl;
      # .2.17 pins the glibc floor, while musl libraries link its dynamic libc.
      rm -rf "${PASTE_LIB_ROOT}"
      for spec in ${PASTE_LIB_TARGETS}; do
        target="${spec%.2.17}"
        rustup target add "${target}"
        case "${target}" in
          *-linux-musl)
            RUSTFLAGS="${RUSTFLAGS:-} -C target-feature=-crt-static" \
              cargo zigbuild --locked --release -p paste-assetgraph-ffi --target "${spec}"
            ;;
          *)
            cargo zigbuild --locked --release -p paste-assetgraph-ffi --target "${spec}"
            ;;
        esac
        case "${target}" in
          x86_64-unknown-linux-gnu)  platform=linux-amd64;    file=libpaste_assetgraph_ffi.so ;;
          aarch64-unknown-linux-gnu) platform=linux-aarch64;  file=libpaste_assetgraph_ffi.so ;;
          x86_64-unknown-linux-musl) platform=linux-amd64-musl; file=libpaste_assetgraph_ffi.so ;;
          aarch64-unknown-linux-musl) platform=linux-aarch64-musl; file=libpaste_assetgraph_ffi.so ;;
          aarch64-apple-darwin)      platform=darwin-aarch64; file=libpaste_assetgraph_ffi.dylib ;;
          x86_64-apple-darwin)       platform=darwin-amd64;   file=libpaste_assetgraph_ffi.dylib ;;
          x86_64-pc-windows-gnu)     platform=windows-amd64;  file=paste_assetgraph_ffi.dll ;;
          *) echo "no platform mapping for ${target}" >&2; exit 1 ;;
        esac
        mkdir -p "${PASTE_LIB_ROOT}/${platform}"
        cp "target/${target}/release/${file}" "${PASTE_LIB_ROOT}/${platform}/${file}"
      done
      NATIVE_ROOT="${PASTE_LIB_ROOT}" python3 - <<'PY'
      import hashlib, json, os
      from pathlib import Path
      root = Path(os.environ["NATIVE_ROOT"])
      manifest = {p.name: hashlib.sha256(f.read_bytes()).hexdigest()
                  for p in sorted(d for d in root.iterdir() if d.is_dir())
                  for f in sorted(p.iterdir())}
      (root / "manifest.json").write_text(json.dumps(manifest, sort_keys=True) + "\n")
      PY
      cat "${PASTE_LIB_ROOT}/manifest.json"
    - python3 tests/build_shared_fixture.py --build linux-musl-release --out "${PASTE_ASSETGRAPH_TEST_FIXTURE}"
  artifacts:
    paths:
      - target/*/release/paste-assetgraph*
      - runtime/scala/sbt-plugin/src/main/resources/native/
      - runtime/native/
      - target/shared-fixture/
      - SHA256SUMS
    expire_in: 1 hour

test-rust:
  extends: [.runs-on-branch-or-tag]
  image: ${CICD_PIPELINES_RUST_IMAGE}
  stage: test
  needs: [build-rust]
  script:
    - cargo test --locked --workspace

build-sbt:
  extends: [.runs-on-branch-or-tag]
  image: ${CICD_PIPELINES_REGISTRY}/cicd-runner-sbtdockertofu:${CICD_PIPELINES_RUNNER_TAG}
  stage: build
  needs: [build-rust]
  script:
    - cd runtime/scala
    - sbt package packageSrc packageDoc
    - cd sbt-plugin
    - sbt compile package packageSrc packageDoc
    # Every published JAR must carry the authoritative root legal texts at
    # the JVM-conventional paths — inspect the real archives, not the build
    # definition, so a dropped mapping fails here instead of in a release.
    # Each family publishes binary, sources, and documentation archives —
    # every classifier is required explicitly: a missing packageDoc would
    # otherwise let a binary JAR satisfy a family that produced no
    # documentation at all.
    - |
      cd "${CI_PROJECT_DIR}"
      status=0
      jars=""
      # sbt appends the CI revision on branch pipelines (magicroot
      # TomshleyCIBuildVersionPlugin); only tag pipelines use the bare VERSION.
      version="$(head -1 VERSION | tr -d '[:space:]')${TOMSHLEY_CICD_BUILD_REVISION:+-${TOMSHLEY_CICD_BUILD_REVISION}}"
      for spec in \
        "runtime/scala/runtime/target/scala-*/paste-assetgraph-runtime_3-${version}.jar" \
        "runtime/scala/runtime/target/scala-*/paste-assetgraph-runtime_3-${version}-sources.jar" \
        "runtime/scala/runtime/target/scala-*/paste-assetgraph-runtime_3-${version}-javadoc.jar" \
        "runtime/scala/pekko/target/scala-*/paste-assetgraph-pekko_3-${version}.jar" \
        "runtime/scala/pekko/target/scala-*/paste-assetgraph-pekko_3-${version}-sources.jar" \
        "runtime/scala/pekko/target/scala-*/paste-assetgraph-pekko_3-${version}-javadoc.jar" \
        "runtime/scala/sbt-plugin/target/scala-*/sbt-*/paste-assetgraph-sbt*-${version}.jar" \
        "runtime/scala/sbt-plugin/target/scala-*/sbt-*/paste-assetgraph-sbt*-${version}-sources.jar" \
        "runtime/scala/sbt-plugin/target/scala-*/sbt-*/paste-assetgraph-sbt*-${version}-javadoc.jar" \
      ; do
        found=0
        for jar in $spec; do
          [ -f "$jar" ] || continue
          jars="$jars
          $jar"
          found=1
        done
        [ "$found" -eq 1 ] || { echo "ERROR: expected artifact produced nothing: ${spec}"; status=1; }
      done
      for jar in $jars; do
        for entry in LICENSE NOTICE THIRD_PARTY_LICENSES.md; do
          meta="META-INF/${entry%.md}"
          if ! unzip -p "$jar" "$meta" | diff -q - "$entry" > /dev/null; then
            echo "ERROR: $jar does not carry $entry at $meta (or it diverges)"
            status=1
          fi
        done
      done
      echo "legal-file gate examined:$(printf '%s\n' $jars | sed 's/^/ /')"
      [ "$status" -eq 0 ] || exit 1
  artifacts:
    paths: [runtime/scala/**/target/]
    expire_in: 1 hour

test-sbt:
  extends: [.runs-on-branch-or-tag]
  image: ${CICD_PIPELINES_REGISTRY}/cicd-runner-sbtdockertofu:${CICD_PIPELINES_RUNNER_TAG}
  stage: test
  needs: [build-rust, build-sbt]
  # The runtime specs resolve the bundled library from the build-rust
  # artifact (runtime/native/ is on the classpath); the sbt-plugin specs
  # inject their own environment.
  script:
    - cd runtime/scala
    - sbt test
    - cd sbt-plugin
    - sbt test

# The language runtimes load the shared library in-process, so their tests
# run against the bundled copy from the build-rust artifact.
test-node:
  extends: [.runs-on-branch-or-tag]
  image: node:22.14.0-bookworm
  stage: test
  needs: [build-rust]
  variables:
    PASTE_ASSETGRAPH_TEST_BIN: "${CI_PROJECT_DIR}/target/x86_64-unknown-linux-musl/release/paste-assetgraph"
  script:
    - cp -R runtime/native/native-lib runtime/node/native-lib
    # The package must carry the legal files the publish job copies in.
    - cp LICENSE NOTICE THIRD_PARTY_LICENSES.md runtime/node/
    - node scripts/check_npm_package_legal.cjs
    - cd runtime/node
    - npm ci
    - npm test

test-python:
  extends: [.runs-on-branch-or-tag]
  image: python:3.13.2-slim
  stage: test
  needs: [build-rust]
  script:
    - cp -R runtime/native/native-lib runtime/python/src/paste_assetgraph/native-lib
    - cp LICENSE NOTICE THIRD_PARTY_LICENSES.md runtime/python/
    # The wheel must carry the legal files under its dist-info.
    - python scripts/check_wheel_legal.py
    - python -m pip install --no-cache-dir ./runtime/python
    - python -m unittest discover -s runtime/python/tests -v

test-node-musl:
  extends: [test-node]
  image: node:22.14.0-alpine

test-python-musl:
  extends: [test-python]
  image: python:3.13.2-alpine

# A dist build must produce byte-identical output on every platform, because the
# manifest and the generated files are committed artifacts consumers diff. The
# Linux run publishes the reference tree; the Windows run rebuilds and compares
# every file.
determinism-linux:
  extends: [.runs-on-branch-or-tag]
  image: ${CICD_PIPELINES_RUST_IMAGE}
  stage: test
  needs: [build-rust]
  script:
    # The manifest now keeps last-modified stamps; pinning them to the commit
    # time keeps the committed-bytes comparison platform-independent.
    - export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
    - target/x86_64-unknown-linux-musl/release/paste-assetgraph build --config "${DETERMINISM_CONFIG}"
    - mkdir -p "${DETERMINISM_REFERENCE}/dist"
    - cp -r features/dist/. "${DETERMINISM_REFERENCE}/dist/"
    - find "${DETERMINISM_REFERENCE}/dist" -type f -exec sha256sum {} +
  artifacts:
    paths: ["${DETERMINISM_REFERENCE}"]
    expire_in: 1 hour

determinism-windows:
  extends: [.runs-on-branch-or-tag]
  stage: test
  tags: [saas-windows-medium-amd64]
  needs: [build-rust, determinism-linux]
  script:
    # Same stamp pin as determinism-linux so the rebuilt bytes match.
    - $env:SOURCE_DATE_EPOCH = git log -1 --format=%ct
    - .\target\x86_64-pc-windows-gnu\release\paste-assetgraph.exe build --config $env:DETERMINISM_CONFIG
    - |
      # Hash every file under each dist tree keyed by its forward-slash
      # relative path, then compare the two sets — a file that differs,
      # appears, or disappears on one platform fails the check.
      $hashTree = {
        param($root)
        $rootPath = (Get-Item $root).FullName
        Get-ChildItem -Force -Recurse -File $rootPath | ForEach-Object {
          $rel = $_.FullName.Substring($rootPath.Length + 1).Replace('\', '/')
          "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $rel
        }
      }
      $reference = @(& $hashTree "$env:DETERMINISM_REFERENCE\dist")
      $rebuilt = @(& $hashTree "features\dist")
      $diff = Compare-Object -CaseSensitive $reference $rebuilt
      if ($diff) {
        $diff | ForEach-Object { Write-Host $_.InputObject }
        throw "features/dist differs between linux and windows ($($reference.Count) vs $($rebuilt.Count) files)"
      }
      Write-Host "$($rebuilt.Count) files match on both platforms"

# Publishing waits for every test that judges the binaries being published —
# the language-runtime tests exercise the binary's render/combo contract, and
# the cross-platform determinism check is one no later job can undo.
publish-cli:
  extends: [.tomshley-cicd-publish-cargo]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$TOMSHLEY_CICD_FLOW_TYPE == "develop"'
      when: on_success
    - if: '$TOMSHLEY_CICD_FLOW_TYPE =~ /^(feature|hotfix|release)$/'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
  needs: [lint-rust, msrv-rust, build-rust, test-rust, test-node, test-node-musl, test-python, test-python-musl, determinism-linux, determinism-windows]

# The recipe publishes one coordinate — the pinnable {ref-slug}-{sha}. A consumer
# cannot track a branch by a version that changes every pipeline, so the rolling
# {ref-slug}-latest coordinate is published after it. On a tag both revisions are
# empty and the clean version publishes once, so the second pass is skipped.
publish-maven:
  extends: [.tomshley-cicd-publish-sbt]
  needs: [lint-rust, msrv-rust, build-rust, test-rust, test-sbt, test-node, test-node-musl, test-python, test-python-musl, determinism-linux, determinism-windows]
  variables:
    TOMSHLEY_CICD_PUBLISH_PROJECT_ID: "70289607"
  before_script:
    # The recipe script resolves the publish policy in its own process, so the
    # job shell needs it too before it can decide whether a rolling pass applies.
    - !reference [.tomshley-cicd-recipe-env, before_script]
    - !reference [.before-artifact-tags, before_script]
  script:
    - cd runtime/scala
    - bash "${TOMSHLEY_CICD_TOOLBOX_ROOT}/publish/sbt.sh" sbt +runtime/publish +pekko/publish
    - cd sbt-plugin
    - bash "${TOMSHLEY_CICD_TOOLBOX_ROOT}/publish/sbt.sh" sbt publish
    - |
      if [ "${CICD_PUBLISH_ROLLING}" = "true" ]; then
        cd "${CI_PROJECT_DIR}/runtime/scala"
        TOMSHLEY_CICD_BUILD_REVISION="${CICD_PUBLISH_ROLLING_TAG}" sbt +runtime/publish +pekko/publish
        cd sbt-plugin
        TOMSHLEY_CICD_BUILD_REVISION="${CICD_PUBLISH_ROLLING_TAG}" sbt publish
      fi

# Both publish the runtime package — with its bundled native libraries — to
# this project's GitLab package registry.
publish-npm:
  extends: [.tomshley-cicd-publish-npm]
  needs: [lint-rust, msrv-rust, build-rust, test-rust, test-node, test-node-musl, determinism-linux, determinism-windows]
  script:
    - cp -R runtime/native/native-lib runtime/node/native-lib
    - cp LICENSE NOTICE THIRD_PARTY_LICENSES.md runtime/node/
    - cd runtime/node
    - !reference [.tomshley-cicd-publish-npm, script]

publish-python:
  extends: [.tomshley-cicd-publish-python]
  needs: [lint-rust, msrv-rust, build-rust, test-rust, test-python, test-python-musl, determinism-linux, determinism-windows]
  variables:
    TOMSHLEY_CICD_PYPI_PACKAGE: paste-assetgraph
  script:
    - cp -R runtime/native/native-lib runtime/python/src/paste_assetgraph/native-lib
    - cp LICENSE NOTICE THIRD_PARTY_LICENSES.md runtime/python/
    - cd runtime/python
    - !reference [.tomshley-cicd-publish-python, script]

release-assets:
  extends: [.tomshley-cicd-release-assets]
  needs: [lint-rust, msrv-rust, build-rust, test-rust, test-node, test-node-musl, test-python, test-python-musl, determinism-linux, determinism-windows]
  variables:
    TOMSHLEY_CICD_RELEASE_CHECKSUM_FILE: SHA256SUMS
    TOMSHLEY_CICD_RELEASE_EXTRA_ASSETS: "LICENSE NOTICE THIRD_PARTY_LICENSES.md"
