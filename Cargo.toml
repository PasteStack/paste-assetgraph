[package]
name = "paste-assetgraph"
version = "0.1.0"
edition = "2021"
authors = ["PasteStack Contributors"]
description = "Asset pipeline for PasteStack with auto-versioning and dependency resolution"
license = "MIT"
repository = "https://github.com/PasteStack/paste-assetgraph"

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive"] }

# Serialization
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0"

# File watching
notify = "6.1"

# Hashing
md5 = "0.7"

# SCSS compilation
grass = "0.13"

# JS minification - use minify-js (simpler, no swc dependency issues)
minify-js = "0.6"

# CSS minification
lightningcss = "1.0.0-alpha.70"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP server for JAM endpoint
axum = "0.7"

# Serialization for manifest
bincode = "1.3"

# Regex for parsing @requires
regex = "1.10"

# Path handling
walkdir = "2.4"

# Time
chrono = "0.4"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
