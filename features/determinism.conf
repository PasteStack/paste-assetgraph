source.scss = "features"
source.js = "features"
output.base = "features/dist"
output.js = "features/dist/js"
output.css = "features/dist/css"
output.images = "features/dist/images"
manifest = "features/dist/manifest.json"
storage.backend = "dist"
include-paths = []
debug-mode = false
minify = true
# The compared tree is individual versioned compiled files plus the
# manifest — JS sources carry a real dependency so dependency ordering and
# hash-qualified output names are part of the fingerprinted set.
